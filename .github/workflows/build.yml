name: 打包 Wails App

on:
  push:
    tags:
      - 'v*'    # 当你推送 v1.0.0 这样的标签时触发

jobs:
  build-linux-arm64:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取你的代码
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2. 安装 Linux 系统依赖（Wails 需要这些库）
      - name: 安装 Linux 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev

      # 3. 安装 Go 语言环境
      - name: 安装 Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      # 4. 安装 Node.js 环境
      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # 5. 安装 Wails CLI 工具
      - name: 安装 Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      # 6. 执行打包（核心步骤）
      - name: 打包 Linux ARM64
        env:
          GOOS: linux
          GOARCH: arm64
        run: wails build --platform linux/arm64 -package

      # 7. 上传打包产物（供下载）
      - name: 上传 AppImage
        uses: actions/upload-artifact@v4
        with:
          name: 我的应用-linux-arm64
          path: build/bin/*.AppImage