name: 打包 Wails App

on:
  push:
    tags:
      - 'v*'

jobs:
  build-rpi-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v5
        with:
          submodules: recursive

      # 安装系统依赖 + arm64交叉编译器
      - name: 安装系统依赖与交叉编译工具
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev gcc-aarch64-linux-gnu

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: 安装Wails v2 CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: 安装前端依赖
        run: cd frontend && npm install

      # 交叉编译 linux/arm64（树莓派64位）
      - name: 构建打包arm64
        env:
          CGO_ENABLED: 1
          CC: aarch64-linux-gnu-gcc
        run: wails build --platform linux/arm64 -package

      # 上传产物：AppImage + deb包
      - name: 上传树莓派arm64产物
        uses: actions/upload-artifact@v4
        with:
          name: rpi-arm64-package
          path: build/bin/*