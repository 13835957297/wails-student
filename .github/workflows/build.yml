name: 打包 Wails App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # Linux AMD64（x86_64，最常见的 PC/服务器）
  build-linux-amd64:
    runs-on: ubuntu-22.04
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 安装 Linux 编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            libayatana-appindicator3-dev \
            libfuse2 \
            patchelf

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 构建前端
        working-directory: ./frontend
        run: |
          npm install
          npm run build

      - name: 安装 Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: 编译 Linux AMD64
        env:
          CGO_ENABLED: 1
        run: wails build --platform linux/amd64

      - name: 上传 AppImage
        uses: actions/upload-artifact@v4
        with:
          name: aigc-student-linux-amd64
          path: build/*.AppImage