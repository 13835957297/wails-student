name: 打包 Wails App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # Linux AMD64（x86_64，最常见的 PC/服务器）
  build-linux-amd64:
    runs-on: ubuntu-22.04
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 安装 Linux 编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            libayatana-appindicator3-dev \
            libfuse2 \
            patchelf

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 构建前端
        working-directory: ./frontend
        run: |
          npm install
          npm run build

      - name: 安装 Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: 编译 Linux AMD64
        env:
          CGO_ENABLED: 1
        run: wails build --platform linux/amd64

      - name: 打包 AppImage
        run: |
          set -e

          # 1. 下载 appimagetool
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

          # 2. 搭建 AppDir 目录结构
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          # 3. 拷贝编译好的二进制
          cp build/bin/aigc-student AppDir/usr/bin/aigc-student

          # 4. 生成 AppRun 启动脚本
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          exec "${HERE}/usr/bin/aigc-student" "$@"
          EOF
          chmod +x AppDir/AppRun

          # 5. 生成 desktop 文件（AppDir 根目录 + usr/share/applications 各放一份）
          cat > AppDir/aigc-student.desktop <<'EOF'
          [Desktop Entry]
          Name=AIGC学生端
          Exec=aigc-student
          Icon=aigc-student
          Type=Application
          Categories=Utility;
          EOF
          cp AppDir/aigc-student.desktop AppDir/usr/share/applications/aigc-student.desktop

          # 6. 生成占位图标（256x256 PNG，纯色，后续可替换）
          python3 - <<'EOF'
          import struct, zlib

          def chunk(typ, data):
              c = struct.pack('>I', len(data)) + typ + data
              c += struct.pack('>I', zlib.crc32(typ + data) & 0xffffffff)
              return c

          width = height = 256
          r, g, b = 0x2D, 0x9C, 0xD8  # 占位蓝色

          row = b'\x00' + bytes([r, g, b]) * width
          raw = row * height
          ihdr = struct.pack('>IIBBBBB', width, height, 8, 2, 0, 0, 0)
          idat = zlib.compress(raw, 9)
          png = (b'\x89PNG\r\n\x1a\n'
                 + chunk(b'IHDR', ihdr)
                 + chunk(b'IDAT', idat)
                 + chunk(b'IEND', b''))

          with open('AppDir/aigc-student.png', 'wb') as f:
              f.write(png)
          import shutil
          shutil.copy('AppDir/aigc-student.png',
                      'AppDir/usr/share/icons/hicolor/256x256/apps/aigc-student.png')
          EOF

          # 7. 用 appimagetool 打包（APPIMAGE_EXTRACT_AND_RUN 避免 FUSE 问题）
          APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool-x86_64.AppImage AppDir aigc-student.AppImage

          # 8. 确认产物
          ls -l aigc-student.AppImage

      - name: 上传 AppImage
        uses: actions/upload-artifact@v4
        with:
          name: aigc-student-linux-amd64
          path: aigc-student.AppImage